name: Publish approved presentation
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Stage public files only
        run: |
          mkdir -p _site/docs
          cp index.html app.js content.js narration-th.js visuals.js styles.css cinematic.css keynote-v3.css _site/
          cp -r assets _site/
          cp docs/research.md docs/narration.md docs/visual-assets-v2.md docs/image-prompts-v2.json docs/visual-assets-v3.md _site/docs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
